name: DevSpeak AI - GitOps CI & Automated Image Promotion

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "deploy/gitops/charts/**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: gitops-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: "project-12679df0-893b-4260-924"
  GCP_REGION: "asia-southeast1"
  WIF_PROVIDER: "projects/359194986638/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
  WIF_SERVICE_ACCOUNT: "devspeak-prod-deployer-sa@project-12679df0-893b-4260-924.iam.gserviceaccount.com"
  ARTIFACT_REGISTRY: "asia-southeast1-docker.pkg.dev/project-12679df0-893b-4260-924/devspeak-docker"

jobs:
  build-and-promote:
    name: Build Images & Promote to GitOps Desired State
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend API Image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/devspeak-api:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/devspeak-api:gitops-latest

      - name: Build & Push Frontend Web Image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/devspeak-web:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/devspeak-web:gitops-latest

      - name: Update GitOps Helm Values with Immutable Tag
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Promoting image tag to GitOps manifests: ${IMAGE_TAG}"

          # Update GKE portfolio values
          sed -i "s|tag: \".*\"|tag: \"${IMAGE_TAG}\"|g" deploy/gitops/environments/gke-portfolio/values-api.yaml
          sed -i "s|tag: \".*\"|tag: \"${IMAGE_TAG}\"|g" deploy/gitops/environments/gke-portfolio/values-web.yaml

      - name: Commit and Push Desired State to GitOps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/gitops/environments/gke-portfolio/
          if git diff --staged --quiet; then
            echo "No GitOps manifest changes to commit."
          else
            git commit -m "chore(gitops): promote release ${GITHUB_SHA} to gke-portfolio [skip ci]"
            git push origin main
          fi
