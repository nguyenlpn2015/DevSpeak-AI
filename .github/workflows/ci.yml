name: DevSpeak AI - Continuous Integration & DevSecOps Quality Gates

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# Least-privilege permissions: read-only access to repository contents
permissions:
  contents: read

# Cancel redundant in-flight workflow runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Job 1: Secret Leak Detection (Gitleaks)
  # =========================================================================
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code with full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # Job 2: Backend Quality & DevSecOps Gates
  # =========================================================================
  backend-quality:
    name: Backend CI & SAST (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Python Code Linting (Ruff)
        run: python -m ruff check .

      - name: Python Formatting Check (Ruff)
        run: python -m ruff format --check .

      - name: Static Application Security Testing (Bandit SAST)
        run: python -m bandit -r src

      - name: Dependency Vulnerability Audit (pip-audit)
        continue-on-error: true
        run: python -m pip-audit -r requirements.txt

      - name: Verify Alembic Database Migrations
        run: |
          python -m alembic upgrade head
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci_test_migration.db"
          AI_PROVIDER: "mock"

      - name: Execute Automated Test Suite (Pytest - 100% Offline Mock)
        run: python -m pytest -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
          AI_PROVIDER: "mock"
          ENVIRONMENT: "test"

  # =========================================================================
  # Job 3: Frontend Quality & Build Gates
  # =========================================================================
  frontend-quality:
    name: Frontend CI & Production Build (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies cleanly (npm ci)
        run: npm ci

      - name: TypeScript Type Check (tsc)
        run: npm run type-check

      - name: Frontend Code Linting (ESLint)
        run: npm run lint

      - name: Unit & Component Tests (Vitest)
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"

  # =========================================================================
  # Job 4: Infrastructure as Code & Helm Chart Quality Gates
  # =========================================================================
  infra-quality:
    name: IaC & Helm Validation (Terraform & Helm 3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Set up Helm 3
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Helm Chart Linting (API & Web)
        run: |
          helm lint deploy/gitops/charts/devspeak-api
          helm lint deploy/gitops/charts/devspeak-web

      - name: Helm Template Validation (local-kind values)
        run: |
          helm template devspeak-api deploy/gitops/charts/devspeak-api -f deploy/gitops/environments/local-kind/values-api.yaml > /dev/null
          helm template devspeak-web deploy/gitops/charts/devspeak-web -f deploy/gitops/environments/local-kind/values-web.yaml > /dev/null

      - name: Helm Template Validation (gke-portfolio values)
        run: |
          helm template devspeak-api deploy/gitops/charts/devspeak-api -f deploy/gitops/environments/gke-portfolio/values-api.yaml > /dev/null
          helm template devspeak-web deploy/gitops/charts/devspeak-web -f deploy/gitops/environments/gke-portfolio/values-web.yaml > /dev/null

  # =========================================================================
  # Job 5: Container Build Integrity Validation
  # =========================================================================
  container-build-test:
    name: Container Build Integrity (Docker Buildx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Dockerfile (Validation Only, No Push)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          tags: devspeak-api:test

      - name: Build Frontend Dockerfile (Validation Only, No Push)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          tags: devspeak-web:test

  # =========================================================================
  # Job 6: Documentation & Link Integrity
  # =========================================================================
  docs-quality:
    name: Documentation Link Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Relative Link & Anchor Validator
        run: python scripts/verify-markdown-links.py
