apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devspeak-gke-ingress
  namespace: devspeak
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: devspeak-api
                port:
                  number: 8000
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: devspeak-api
                port:
                  number: 8000
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: devspeak-web
                port:
                  number: 3000
