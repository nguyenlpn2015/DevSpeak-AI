apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devspeak-ingress-local
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: devspeak-api
                port:
                  number: 8000
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: devspeak-api
                port:
                  number: 8000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: devspeak-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devspeak-web
                port:
                  number: 3000
