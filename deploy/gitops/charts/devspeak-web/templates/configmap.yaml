apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devspeak-web.fullname" . }}-config
  labels:
    {{- include "devspeak-web.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  HOSTNAME: {{ .Values.env.HOSTNAME | quote }}
  NEXT_TELEMETRY_DISABLED: {{ .Values.env.NEXT_TELEMETRY_DISABLED | quote }}
  NEXT_PUBLIC_API_URL: {{ .Values.env.NEXT_PUBLIC_API_URL | quote }}
