# Default values for devspeak-api.
replicaCount: 2

image:
  repository: asia-southeast1-docker.pkg.dev/project-12679df0-893b-4260-924/devspeak-docker/devspeak-api
  pullPolicy: IfNotPresent
  tag: "205e972893d3cd326301a8af3a774c9443e1f35d"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

env:
  ENVIRONMENT: "development"
  DEBUG: "false"
  AI_PROVIDER: "mock"
  AUTO_MIGRATE: "false"
  PORT: "8000"
  DATABASE_URL: "postgresql+asyncpg://devspeak_user:devspeak_dev_password@postgres-dev:5432/devspeak_db"
  CORS_ORIGINS: "http://localhost,http://localhost:3000,http://devspeak.local"
  DAILY_QUESTION_QUOTA: "20"
  MAX_ANSWER_LENGTH: "4000"

secrets:
  JWT_SECRET_KEY: "devspeak-local-insecure-jwt-secret-key-32chars"
  DATABASE_PASSWORD: "devspeak_dev_password"
  GEMINI_API_KEY: ""

existingSecret: ""

migration:
  enabled: true
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
  backoffLimit: 2

probes:
  startup:
    httpGet:
      path: /readyz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 10
  liveness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 2

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
