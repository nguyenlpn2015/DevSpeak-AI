{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devspeak-api.fullname" . }}-secret
  labels:
    {{- include "devspeak-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ .Values.secrets.JWT_SECRET_KEY | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.DATABASE_PASSWORD | quote }}
  PGPASSWORD: {{ .Values.secrets.DATABASE_PASSWORD | quote }}
  {{- if .Values.secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | quote }}
  {{- end }}
{{- end }}
