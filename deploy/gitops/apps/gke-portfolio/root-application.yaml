apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devspeak-gke-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: devspeak-gke-root
    app.kubernetes.io/part-of: devspeak-ai
    environment: gke-portfolio
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyenlpn2015/DevSpeak-AI.git
    targetRevision: main
    path: deploy/gitops/apps/gke-portfolio
    directory:
      recurse: false
      exclude: 'root-application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
