apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devspeak-api-gke
  namespace: argocd
  labels:
    app.kubernetes.io/name: devspeak-api
    app.kubernetes.io/part-of: devspeak-ai
    environment: gke-portfolio
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyenlpn2015/DevSpeak-AI.git
    targetRevision: main
    path: deploy/gitops/charts/devspeak-api
    helm:
      valueFiles:
        - ../../environments/gke-portfolio/values-api.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devspeak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
