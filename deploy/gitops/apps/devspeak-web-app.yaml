apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devspeak-web
  namespace: argocd
  labels:
    app.kubernetes.io/name: devspeak-web
    app.kubernetes.io/part-of: devspeak-ai
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyenlpn2015/DevSpeak-AI.git
    targetRevision: main
    path: deploy/gitops/charts/devspeak-web
    helm:
      valueFiles:
        - ../../environments/local-kind/values-web.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
